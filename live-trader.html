<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FEM LIVE TRADER</title><style>
body{background:#0d1117;color:#e6edf3;font-family:Segoe UI,Arial,sans-serif;margin:0 auto;padding:18px;max-width:760px}
h1{font-size:22px;margin:0 0 2px;text-align:center;letter-spacing:1px}
.sub{color:#8b949e;font-size:12px;text-align:center;margin-bottom:16px}
.row{display:flex;align-items:center;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 14px;margin:8px 0}
.info{flex:1;min-width:0}.l1{font-size:17px}
.sym{font-weight:800;font-size:19px;margin-right:14px}.sym-BUY{color:#7ee787}.sym-SELL{color:#ff7b72}
.lbl{color:#8b949e}.val{color:#79c0ff;font-weight:600;margin-right:12px}
.l2{color:#8b949e;font-size:11px;margin-top:3px}.tag{color:#d29922;font-weight:700}
button.trade{font-size:15px;font-weight:800;border:none;border-radius:7px;padding:10px 16px;background:#238636;color:#fff;margin-left:12px;opacity:.55}
.empty{color:#484f58;font-style:italic;text-align:center;padding:28px 0}
details{margin-top:14px;color:#8b949e;font-size:12px}summary{cursor:pointer;color:#79c0ff}
.tape{font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;color:#8b949e;padding:6px 0}
</style></head><body>
<h1>FEM LIVE TRADER</h1>
<div class="sub"><span id="sess" style="color:#d29922;font-weight:700"></span> &middot; <span id="clock"></span> desk time &middot; auto-updates from the desk (~2 min lag) &middot; buttons live only on the desk</div>
<div id="rows"><div class="empty">loading the desk feed...</div></div>
<details><summary>fills today</summary><div id="fills" class="tape"></div></details>
<script>
var SRC='https://raw.githubusercontent.com/ideggplant/fem-live/main/live-trader-state.json';
function fmt(x){return (x==null)?'-':Number(x).toFixed(Math.abs(x)>=100?2:(Math.abs(x)>=10?3:4))}
function row(p){
 var verb=(p.side=='SELL')?'Sell':'Buy';
 var lv=p.trail_pct?('<span class="lbl">'+verb+':</span> <span class="val">'+fmt(p.entry)+'</span><span class="lbl">Trail:</span> <span class="val">'+p.trail_pct+'%</span>')
  :('<span class="lbl">'+verb+':</span> <span class="val">'+fmt(p.entry)+'</span><span class="lbl">Stop:</span> <span class="val">'+fmt(p.stop)+'</span><span class="lbl">Target:</span> <span class="val">'+fmt(p.target)+'</span>');
 var tag=(p.status=='NEW')?'':(' &middot; <span class="tag">'+(p.status=='TAKEN'?'machine took it':p.status.toLowerCase())+'</span>');
 return '<div class="row"><div class="info"><div class="l1"><span class="sym sym-'+p.side+'">'+p.sym+'</span>'+lv+'</div>'
  +'<div class="l2">'+(p.source||'')+' &middot; '+p.age_min+'m ago'+tag+'</div></div><button class="trade" disabled>TRADE</button></div>';
}
function load(){fetch(SRC+'?_='+Date.now()).then(function(r){return r.json()}).then(function(s){
 document.getElementById('clock').textContent=s.now;
 document.getElementById('sess').textContent=s.session;
 document.getElementById('rows').innerHTML=s.rows.length?s.rows.map(row).join(''):'<div class="empty">no fires yet this session</div>';
 document.getElementById('fills').textContent=(s.fills||[]).map(function(f){return f.t+'  '+f.side+' '+f.qty+' '+f.sym+' @ '+f.px}).join('\n')||'none yet';
}).catch(function(e){})}
load();setInterval(load,25000);
</script></body></html>
